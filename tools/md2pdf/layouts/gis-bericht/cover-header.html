<!DOCTYPE html>
<!--
  cover-header.html – Logo oben rechts auf der Titelseite
  Wird nur auf der Titelseite als Kopfzeile eingesetzt.

  Die Höhe des Logos auf der Seite wird in layout.psd1 mit
  CoverHeaderSpacing eingestellt (negativer Wert = Logo weiter unten).
  Das Bild liegt im gleichen Ordner wie diese Datei.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; text-align: right; }
  /* Logo-Grösse: 40 mm x Verkleinerungsfaktor 0.84 = ca. 33 mm auf dem Blatt,
     das entspricht der Originalgrösse in der Word-Vorlage */
  img  { width: 40mm; }
</style>
</head>
<body>
  <img src="logo.png" alt="GIS Nidwalden Obwalden">
</body>
</html>
